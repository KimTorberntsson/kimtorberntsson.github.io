---
layout: page
title: Blog Archive
---

<div id="posts">
	{% assign years = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
	{% for year in years %}
	<h2 class="year-heading">{{ year.name }}</h2>
	<ul class="list-posts">
		{% for post in year.items %}
		<li>
			<a href="{{post.url}}">
				<p>
					{{ post.title }}
					<span class="date-link">{{ post.date | date: "%-d %B" }}</span>
				</p>
			</a>
		</li>
		{% endfor %}
	</ul>
	{% endfor %}
</div>
<hr>
